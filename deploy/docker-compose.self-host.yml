services:
  municlaw-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: municlaw-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Production
      - MUNICLAW_STORAGE_PATH=${MUNICLAW_STORAGE_PATH:-/var/lib/municlaw/data}
      - MUNICLAW_SECRET_PATH=${MUNICLAW_SECRET_PATH:-/var/lib/municlaw/secrets}
      - MUNICLAW_MASTER_KEY=${MUNICLAW_MASTER_KEY:-}
    volumes:
      - municlaw_data:/var/lib/municlaw/data
      - municlaw_secrets:/var/lib/municlaw/secrets
    ports:
      - "${MUNICLAW_API_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      municlaw-net:
        aliases:
          - api
          - municlaw-api

  municlaw-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    container_name: municlaw-worker
    restart: unless-stopped
    depends_on:
      municlaw-api:
        condition: service_healthy
    environment:
      - MUNICLAW_API_URL=${MUNICLAW_API_URL:-http://municlaw-api:5000}
      - MUNICLAW_ORGANIZATION_ID=${MUNICLAW_ORGANIZATION_ID:-00000000-0000-0000-0000-000000000001}
      - MUNICLAW_TASKS_ROOT=${MUNICLAW_TASKS_ROOT:-/tmp/municlaw/tasks}
      - OPENCODE_HOST=${OPENCODE_HOST:-127.0.0.1}
      - OPENCODE_PORT=${OPENCODE_PORT:-4096}
      - OPENCODE_PASSWORD=${OPENCODE_PASSWORD:-opencode-vps-secret}
    volumes:
      - municlaw_tasks:/tmp/municlaw/tasks
    networks:
      municlaw-net:
        aliases:
          - worker
          - municlaw-worker

  municlaw-dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dashboard
    container_name: municlaw-dashboard
    restart: unless-stopped
    depends_on:
      municlaw-api:
        condition: service_healthy
    ports:
      - "${MUNICLAW_PORT:-8080}:8080"
    networks:
      - municlaw-net

volumes:
  municlaw_data:
    name: municlaw_data
  municlaw_secrets:
    name: municlaw_secrets
  municlaw_tasks:
    name: municlaw_tasks

networks:
  municlaw-net:
    name: municlaw_network
    driver: bridge
